name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - src/*
      - package.json
      - pnpm-lock.yaml
    workflow_dispatch:

jobs:
  ci:
    runs-on: codeberg-tiny

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare playground
        run: pnpm dev:prepare

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Publint
        run: pnpm publint
