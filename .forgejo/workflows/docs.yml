name: docs

on:
  push:
    branches:
      - main
    paths:
      - docs/*
  workflow_dispatch:

# permissions:
#   contents: read
#   pages: write
#   id-token: write

jobs:
  docs:
    runs-on: codeberg-tiny # TODO move to lazy

    # environment:
    #   name: Docs (GH Pages)
    #   url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare playground
        run: pnpm dev:prepare

      - name: Build package
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build

      - name: Prepare deploy
        run: |
          mkdir -p /tmp
          cp -rL docs/.vitepress/dist /tmp/pages

      - name: Deploy
        working_directory: /tmp/pages
        run: |
          git init
          git config user.name ${{ vars.git_name }}
          git config user.email ${{ vars.git_email }}
          git branch -m pages
          git remote add pages git@codeberg.org:${{ forge.repository }}
          git add -A
          git commit -m 'automated deployment'
          git push -f pages pages

      - name: Cleanup deploy
        run: rm -rf /tmp
